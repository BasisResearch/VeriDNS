# Reference recursive resolver (unbound) for the differential-testing rig.
# Runs inside the `unbound` namespace, listens on 203.0.113.3:5301, and iterates
# from OUR fake root (root.hints). DNSSEC validation is OFF (iterator only):
# the fake hierarchy is unsigned, so there is no trust anchor to satisfy.
server:
    verbosity: 2
    use-syslog: no
    logfile: ""
    chroot: ""
    username: ""
    directory: "/run"
    pidfile: "/run/unbound-ref.pid"

    interface: 203.0.113.3
    port: 5301
    do-ip6: no
    do-daemonize: no

    access-control: 127.0.0.0/8 allow
    access-control: 203.0.113.0/24 allow
    # The client/attacker vantage lives on 192.168.53.0/24, not on TEST-NET-3:
    # veri-dns's defaultAcl only accepts clients from RFC1918/loopback, so the
    # rig had to split "auth subnet" from "client subnet". Mirror that here or
    # unbound REFUSES the very queries veri-dns answers and the differential is
    # meaningless. (See review/env/vm-up.sh section 2b for the full reasoning.)
    access-control: 192.168.53.0/24 allow

    # Iterate from our fake root; no built-in root, no DNSSEC.
    root-hints: "/opt/dnsenv/unbound/root.hints"
    module-config: "iterator"
    harden-dnssec-stripped: no
    qname-minimisation: no

    # The rig is numbered out of 203.0.113.0/24 (TEST-NET-3), which is NOT in
    # unbound's default `private-address` set, so rebind protection does not
    # strip our leaf answers. This line is belt-and-braces (it was load-bearing
    # back when the rig used RFC1918 10.53.0.x) and is kept so the fake zone
    # stays exempt if private addresses are ever reintroduced.
    private-domain: "test."

    # `.test` is an RFC 6761 special-use TLD, so unbound ships a built-in
    # local-zone that returns an immediate authoritative NXDOMAIN for it. Drop
    # that default so unbound actually iterates into our fake hierarchy.
    local-zone: "test." nodefault

    # Allow talking to on-link private / fake-root upstreams.
    do-not-query-localhost: no
    # Small caches / logging that make cache-poisoning experiments observable.
    log-queries: yes
    log-replies: yes
