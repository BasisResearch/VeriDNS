# Fake LEAF server -- serves ONLY the "example.test." zone, on 10.53.0.12.
# This is the authoritative source for the A/CNAME records under test.
server:
    server-count: 1
    username: ""
    zonesdir: "/opt/dnsenv/nsd/zones"
    database: ""
    pidfile: "/run/nsd-leaf.pid"
    xfrdfile: "/run/nsd-leaf.xfrd"
    zonelistfile: "/run/nsd-leaf.zonelist"
    logfile: ""
    verbosity: 2
    do-ip6: no
    ip-address: 10.53.0.12

zone:
    name: "example.test."
    zonefile: "example.test.zone"
