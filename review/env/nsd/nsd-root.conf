# Fake ROOT server -- serves ONLY the "." zone. Binds the 5 real root-server
# IPs (hardcoded in VeriDNS/Main.lean) plus 10.53.0.10. Serving only "." means
# it hands out referrals for anything below the root -- which is what a correct
# recursive resolver (unbound) requires. (A server that answered authoritatively
# for grandchild names would be rejected as out-of-bailiwick.)
server:
    server-count: 1
    username: ""
    zonesdir: "/opt/dnsenv/nsd/zones"
    database: ""
    pidfile: "/run/nsd-root.pid"
    xfrdfile: "/run/nsd-root.xfrd"
    zonelistfile: "/run/nsd-root.zonelist"
    logfile: ""
    verbosity: 2
    do-ip6: no
    ip-address: 198.41.0.4
    ip-address: 199.9.14.201
    ip-address: 192.33.14.30
    ip-address: 199.7.91.13
    ip-address: 192.203.230.10
    ip-address: 10.53.0.10

zone:
    name: "."
    zonefile: "root.zone"
