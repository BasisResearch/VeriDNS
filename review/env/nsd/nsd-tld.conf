# Fake TLD server -- serves ONLY the "test." zone, on 10.53.0.11. Hands out a
# referral to example.test. for names below it.
server:
    server-count: 1
    username: ""
    zonesdir: "/opt/dnsenv/nsd/zones"
    database: ""
    pidfile: "/run/nsd-tld.pid"
    xfrdfile: "/run/nsd-tld.xfrd"
    zonelistfile: "/run/nsd-tld.zonelist"
    logfile: ""
    verbosity: 2
    do-ip6: no
    ip-address: 10.53.0.11

zone:
    name: "test."
    zonefile: "test.zone"
